# ============================================================
# mise.toml — ツールのバージョン固定 + コマンドのメニュー表
#
# 初めての人は docs/mise入門.md を先に読むこと。
#   mise install  → [tools] のツールが指定バージョンで入る
#   mise run ○○   → [tasks] に登録されたコマンドが動く
#   mise tasks    → タスクの一覧を表示(困ったらこれ)
# ============================================================

[tools]
go = "1.25"    # バックエンド言語(コンテナ外でのエディタ補完・go get 用)
node = "22"    # フロントの道具が動く土台(LTS)
pnpm = "10"    # フロントのパッケージ管理

# ---- 日常操作 ----------------------------------------------

[tasks.up]
description = "開発環境を起動する(frontend/backend/db の3コンテナ。初回・変更時はビルドも実行)"
run = "docker compose up -d --build"

[tasks.down]
description = "開発環境を停止する(DBのデータは消えない)"
run = "docker compose down"

[tasks.logs]
description = "3コンテナのログを流し見る(「なんか動かない」時はまずこれ)"
run = "docker compose logs -f"

[tasks.ports]
description = "このフォルダで使うPC側のポート番号を表示する(ワークツリーを分けて同時起動するとき用)"
run = """
[ -f .env ] && . ./.env
echo "compose プロジェクト名 : $(basename "$PWD" | tr '[:upper:]' '[:lower:]')"
echo "フロント (PC側)        : ${FRONTEND_PORT:-5173}"
echo "バックエンド (PC側)    : ${BACKEND_PORT:-3000}"
echo "DB (PC側)              : ${DB_PORT:-5432}"
echo
echo "ずらすには: mise run ports:shift 10  (.env に書き込む)"
"""

[tasks."ports:shift"]
description = "PC側のポートを指定ぶんずらして .env に書く(例: mise run ports:shift 10 → 5183/3010/5442)"
usage = 'arg "<offset>" help="ずらす数(0以上の整数)"'
run = """
offset="$usage_offset"
case "$offset" in ''|*[!0-9]*) echo "使い方: mise run ports:shift <ずらす数(0以上の整数)>" >&2; exit 1;; esac
touch .env
# 既存の3行を消してから書き直す(重複防止)
grep -v -E '^(FRONTEND_PORT|BACKEND_PORT|DB_PORT)=' .env > .env.tmp && mv .env.tmp .env
{
  echo "# このワークツリー専用のポート(他のワークツリーと衝突しないようにずらしている)"
  echo "FRONTEND_PORT=$((5173 + offset))"
  echo "BACKEND_PORT=$((3000 + offset))"
  echo "DB_PORT=$((5432 + offset))"
} >> .env
echo ".env に書きました。反映するには mise run down && mise run up"
mise run ports
"""

# ---- データベース ------------------------------------------

[tasks."db:migrate"]
description = "migrations/ のSQLを未適用分だけDBに適用する"
run = "docker compose exec backend sh -c 'migrate -path /app/migrations -database \"$DATABASE_URL\" up'"

[tasks."db:seed"]
description = "開発用のサンプル問題データをDBに投入する"
run = "docker compose exec backend go run ./cmd/seed"

[tasks."db:reset"]
description = "【データが消える】DBをまっさらに作り直して migrate + seed までやり直す"
run = "docker compose down -v && docker compose up -d --build && mise run db:migrate && mise run db:seed"

# ---- チェック(CIと同じ内容を手元で先に回す) ----------------

[tasks.lint]
description = "コードチェック(CIと同じ内容。PRを出す前にこれを通す)"
run = [
  "docker compose exec backend sh -c 'test -z \"$(gofmt -l .)\"'",
  "docker compose exec backend go vet ./...",
  "docker compose exec backend go build ./...",
  "docker compose exec frontend pnpm lint",
  "docker compose exec frontend pnpm format:check",
  "docker compose exec frontend pnpm typecheck",
  "docker compose exec frontend pnpm build",
]

[tasks.fix]
description = "自動で直せる書式・コードの問題を直す(gofmt / Prettier / ESLint)"
run = [
  "docker compose exec backend gofmt -w .",
  "docker compose exec frontend pnpm format",
  "docker compose exec frontend pnpm lint:fix",
]

# テスト(vitest / go test)は未導入。導入時にここへ [tasks.test] を追加する。
