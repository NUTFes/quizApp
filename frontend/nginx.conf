# 本番の玄関口。1つのサブドメインを2つに振り分ける。
#   /      → Vite でビルドした静的ファイル
#   /api/  → backend(Go)へ中継
#
# ★ SSE(text/event-stream)は「接続を開きっぱなしで流し続ける」通信なので、
#   普通のWeb向けデフォルト設定と相性が悪い。下の proxy_buffering off などが
#   無いと「ローカルでは動くのに本番だけ画面が切り替わらない」になる。
#   → dev_policy/インフラ・デプロイ_policy.md §SSE特有の落とし穴

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 画像投入API(POST /api/admin/images)が受け取る「リクエスト全体」の上限。既定は 1MB。
    # ★ 5m ではなく 5184k(= 5MB + 64KB)にしている。この上限は画像だけでなく
    #   multipart の区切り・ヘッダ・ファイル名を含むリクエスト全体にかかるので、
    #   5m にすると 5MB ちょうどの画像が包みのぶんだけはみ出して 413 になる。
    #   「画像1枚は5MBまで」はバックエンドが画像本体だけを数えて正確に判定している。
    # ★ backend の internal/image/save.go の MaxRequestBytes と必ず同じ値にする。
    #   本番はここで先に弾かれるが、開発ではバックエンドを直接叩く(nginxを経由しない)ため
    #   両方に要る。
    # ★ ここで弾かれたときに返るのは nginx の 413 HTMLページで、このアプリのJSONエラー形式
    #   ではない。フロントは code ではなく ApiError.status で 413 を分岐すること。
    client_max_body_size 5184k;

    # ---- フロント(SPA) --------------------------------------
    # React Router を使っているので、/monitor などに直接アクセスされても
    # index.html を返す必要がある(ファイルとしては存在しないため)。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html だけはキャッシュさせない。
    # デプロイし直しても古い画面が表示され続ける事故を防ぐ。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ハッシュ付きのファイル名なので長期キャッシュしてよい
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- 問題の画像 ------------------------------------------
    # backend の r.Static("/images", "./static/images") へ中継する。
    #
    # ★ これが無いと /images/xxx.png は上の location / の SPA フォールバックに落ち、
    #   404 ですらなく index.html が 200 で返る。ブラウザ上は「壊れた画像」に
    #   見えるだけで、原因が分かりにくい形で出る(2026-08-29 に実測して判明)。
    #   prefix location は「書いた順」ではなく最長一致なので、/ より先に選ばれる。
    location /images/ {
        resolver 127.0.0.11 valid=10s;   # /api/ と同じ理由(下のコメント参照)
        set $backend_upstream "http://backend:3000";
        proxy_pass $backend_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 画像はファイル名を変えずに差し替えることがあるため、長期キャッシュはしない。
        # 当日「差し替えたのに古いのが出る」を避ける。
        add_header Cache-Control "public, max-age=300";

        # ★ サーバーが image/png と返しているのに、ブラウザが中身を見て「これはHTMLだ」と
        #   解釈し直す挙動(MIMEスニッフィング)を禁止する。
        #   投入API(POST /api/admin/images)は先頭512バイトから実際の種類を判定して
        #   拡張子と違うものを弾いている(backend/internal/image/save.go)ので、
        #   これはそれをすり抜けた場合の二重の防御。
        #   ここを破られると、このアプリと同一オリジンで任意のJSが動き、
        #   localStorage の ADMIN_TOKEN が読まれる。
        add_header X-Content-Type-Options "nosniff";
    }

    # ---- 敗者復活の動画 ----------------------------------------
    # backend の r.Static("/videos", "./static/videos") へ中継する。
    # /images/ と同じ理由(SPAフォールバックより先に選ばれる必要がある)で
    # location / とは別に切る。投入はPOST /api/admin/videosから行う(#158)。
    location /videos/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream "http://backend:3000";
        proxy_pass $backend_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 画像と同じ運用(ファイル名を変えずに差し替える)にするため、キャッシュも揃える。
        add_header Cache-Control "public, max-age=300";

        # ★ /images/ と同じ理由でMIMEスニッフィングを禁止する。
        add_header X-Content-Type-Options "nosniff";

        # ★ proxy_buffering off はここに入れない。/api/ のSSE専用設定であり、
        #   動画の Range リクエストは素通しのままで正しく効く。
    }

    # ---- 敗者復活動画の投入API -------------------------------
    # 500MBの動画を受け取るこの1本だけ、通常のAPIより上限とタイムアウトを広げる。
    # prefix locationは最長一致で選ばれるため、下の /api/ よりこちらが優先される。
    location /api/admin/videos {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream "http://backend:3000";
        proxy_pass $backend_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 動画本体500MBにmultipartの区切り・ヘッダ用64KBを加えた値。
        # ★ backend/internal/video/save.go の MaxRequestBytes と必ず同じ値にする。
        client_max_body_size 512064k;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- API + SSE ------------------------------------------
    location /api/ {
        # ★ upstream 名を「変数」で渡すのが重要。
        # 直接 proxy_pass http://backend:3000; と書くと nginx は【起動時】に名前解決を行い、
        # backend が落ちていると nginx 自体が起動できずクラッシュループになる。
        # 変数にすると【リクエスト時】に解決するので、backend の復旧を待てる。
        # 当日 docker compose restart を叩く順番に悩まなくて済む。
        resolver 127.0.0.11 valid=10s;   # Docker の内蔵DNS
        set $backend_upstream "http://backend:3000";
        proxy_pass $backend_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 動画投入以外のAPIは、従来どおり画像投入に合わせた上限を維持する。
        client_max_body_size 5184k;

        # --- ここから下が SSE のための設定 ---
        # 応答を溜めずに即座に流す(これが無いとイベントが届かない)
        proxy_buffering off;
        proxy_cache off;

        # HTTP/1.1 + Connection ヘッダを空にして、接続を維持したまま流す
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        # 無通信タイムアウト。既定の60秒だと問題と問題の間で全員切断される。
        # ただし本当の担保は Go 側の15秒ハートビート(Cloudflareの100秒切断は
        # ここでは制御できないため)。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
